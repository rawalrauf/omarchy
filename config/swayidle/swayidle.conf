# Lock screen after 2.5 minutes of idle
timeout 150 'omarchy-system-lock'

# Turn displays off after 5 minutes of idle (keyboard already off from lock's 3s delay), turn them back on resume
timeout 300 'omarchy-brightness-display off' resume 'omarchy-system-wake'

# Save keyboard brightness and lock before suspend; skip lock if hibernating
before-sleep 'omarchy-brightness-keyboard off; [[ -f /tmp/omarchy-hibernating ]] && rm -f /tmp/omarchy-hibernating || OMARCHY_LOCK_ONLY=true omarchy-system-lock'
after-resume 'sleep 1 && omarchy-system-wake'
